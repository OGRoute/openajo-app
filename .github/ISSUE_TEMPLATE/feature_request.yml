name: Feature or improvement
description: Propose a change to the SDK, indexer or web app.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Point at the files you expect to touch if you know them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] CI green
  - type: checkboxes
    id: contract
    attributes:
      label: Contract impact
      options:
        - label: This needs a change to contract functions or event shapes (open a linked issue in openajo-contract)
